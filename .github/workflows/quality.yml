name: Quality
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require exact-candidate independent approvals
        run: |
          python tools/bootstrap.py check --repository "$GITHUB_REPOSITORY"
          python tools/review_gate.py check --revision HEAD
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate coverage and run configured gates
        run: |
          python tools/coverage.py check
          python tools/quality.py --evidence "testresults/unreleased/runs/ci-$GITHUB_RUN_ID-${{ matrix.os }}"
      - name: Bundle only current run, including available failures
        if: always()
        run: |
          run="testresults/unreleased/runs/ci-$GITHUB_RUN_ID-${{ matrix.os }}"
          mkdir -p "$run"
          git rev-parse HEAD > "$run/ci-source-commit.txt"
          python tools/evidence.py pack --source "$run" --output artifacts/current-run \
            --scope "Current host CI attempt; inspect raw outcomes. No device/visual/performance certification." \
            --workflow-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-evidence-${{ matrix.os }}
          path: artifacts/current-run/
          retention-days: 14
          if-no-files-found: error
  host:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
